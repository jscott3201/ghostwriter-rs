[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter-trl"
version = "0.1.0"
description = "Verified Ghostwriter Parquet to pinned text-profile SFT token labels"
requires-python = ">=3.12,<3.13"
dependencies = [
  "blake3==1.0.8", "pyarrow==21.0.0", "jinja2==3.1.6",
]

[project.optional-dependencies]
qwen = [
  "transformers==4.56.2", "tokenizers==0.22.0", "safetensors==0.6.2",
  "huggingface-hub==0.36.0", "trl==1.14.1", "datasets==4.7.0",
  "accelerate==1.4.0", "torch==2.8.0",
]
gemma-e2b = [
  "transformers==5.18.0", "tokenizers==0.23.2", "safetensors==0.8.0",
  "huggingface-hub==1.31.0", "trl==1.14.1", "datasets==4.7.0",
  "accelerate==1.4.0", "torch==2.8.0", "torchvision==0.23.0", "pillow==12.3.0",
]
gemma-31b-tools = [
  "transformers==5.18.0", "tokenizers==0.23.2", "safetensors==0.8.0",
  "huggingface-hub==1.31.0", "trl==1.14.1", "datasets==4.7.0",
  "accelerate==1.4.0", "torch==2.8.0", "torchvision==0.23.0", "pillow==12.3.0",
]
gemma-lora = [
  "transformers==5.18.0", "tokenizers==0.23.2", "safetensors==0.8.0",
  "huggingface-hub==1.31.0", "trl==1.14.1", "datasets==4.7.0",
  "accelerate==1.4.0", "torch==2.8.0", "torchvision==0.23.0", "pillow==12.3.0",
  "peft==0.21.2",
]

[project.scripts]
ghostwriter-trl-gemma31b = "ghostwriter_trl.gemma31b.cli:main"
ghostwriter-trl = "ghostwriter_trl.cli:main"
ghostwriter-trl-train = "ghostwriter_trl.training.cli:main"
ghostwriter-trl-cuda-lora = "ghostwriter_trl.cuda_lora.cli:main"
ghostwriter-trl-lora = "ghostwriter_trl.lora.cli:main"
ghostwriter-trl-compare = "ghostwriter_trl.comparison.cli:main"

[tool.setuptools.package-data]
ghostwriter_trl = ["*.json"]
"ghostwriter_trl.profiles" = ["*.json"]
"ghostwriter_trl.gemma31b" = ["*.json"]
"ghostwriter_trl.lora" = ["*.json"]
"ghostwriter_trl.comparison" = ["*.json"]
"ghostwriter_trl.cuda_lora" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
