# nextest configuration for local and CI test runs.
# See https://nexte.st/docs/configuration/ for the profile schema.
#
# Local: `cargo nextest run --workspace`
# CI (release gate): `cargo nextest run --workspace --locked --profile ci`
# Doctests are not run by nextest — run `cargo test --workspace --doc` alongside.

[profile.default]
# Surface slow tests without failing normal iteration.
slow-timeout = { period = "5s", terminate-after = 12 }
# Absorb rare local timing noise in any sleep-bearing concurrency tests.
retries = 1

[profile.ci]
# CI runners are slower than local M-series machines.
slow-timeout = { period = "5s", terminate-after = 24 }
# CI must not hide flakes behind retries.
retries = 0
# Run the full CI test set even if one test fails.
fail-fast = false
final-status-level = "slow"
