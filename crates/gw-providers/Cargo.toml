[package]
name = "gw-providers"
description = "OpenRouter streaming client with hand-rolled chain-of-thought capture, GCRA rate limiting, and retries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
sha2.workspace = true
gw-schema.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
governor.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
# For the integration tests (tests/live_openrouter.rs live smoke + tests/provider_fixtures.rs
# offline replay of real captured SSE). Integration tests are separate crates, so they redeclare
# the deps they name directly. All are existing workspace deps — no new external dependency.
gw-schema.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["http2"] }
# HTTP/2 is test-only: exercise a real REFUSED_STREAM under the production retry policy.
h2 = "0.4"
http = "1"
bytes = "1"
gw-storage.workspace = true
sqlx.workspace = true
